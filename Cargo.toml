[package]
name          = "poli-page"
version       = "0.11.0"
edition       = "2021"
rust-version  = "1.93"
authors       = ["Poli Page"]
description   = "Poli Page SDK for Rust — render PDFs from HTML templates via the Poli Page API"
homepage      = "https://poli.page"
repository    = "https://github.com/poli-page/sdk-rust"
documentation = "https://docs.rs/poli-page"
readme        = "README.md"
license       = "MIT OR Apache-2.0"
keywords      = ["pdf", "html", "template", "rendering", "poli-page"]
categories    = ["api-bindings", "web-programming"]
exclude       = ["/.github", "/scripts", "/examples/templates", "/examples/outputs"]

[lib]
name = "poli_page"
path = "src/lib.rs"

[dependencies]
reqwest      = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio        = { version = "1.40", default-features = false, features = ["time", "rt", "fs", "io-util"] }
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
thiserror    = "2.0"
uuid         = { version = "1.10", features = ["v4", "fast-rng"] }
bytes        = "1.7"
futures-core = "0.3"
tracing      = "0.1"
http         = "1.1"
url          = "2.5"
httpdate     = "1.0"
rand         = "0.10"

[dev-dependencies]
tokio              = { version = "1.40", features = ["macros", "rt-multi-thread", "time", "net", "sync", "io-util", "test-util"] }
wiremock           = "0.6"
serde_json         = "1.0"
tempfile           = "3.13"
futures-util       = "0.3"
tracing-subscriber = "0.3"
# The demo's API-key format check (examples/demo.rs); already in the graph via wiremock.
regex              = "1.12"
# Direct reqwest access for the `PoliPageBuilder::http_client` test/doctest;
# consumers wanting to inject a custom client must add reqwest themselves.
# `http2` lets the unit tests prove the SDK's own client never lets reqwest
# resend a request on its own (src/client.rs, `no_hidden_resend`).
reqwest            = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
# An HTTP/2 server for that test.
h2                 = "0.4"
# tests/contract.rs: one test per API contract case, named by its id.
libtest-mimic      = "0.8"
# SHA-256 of the PDF bytes in tests/contract.rs; already in the graph via rustls.
ring               = "0.17"

# The API contract cases (tests/contract.rs) run under their own harness so
# each case is a test named by its id.
[[test]]
name    = "contract"
harness = false

# The demo carries unit tests (key format check, not-found request body);
# `test = true` makes `cargo test` run them.
[[example]]
name = "demo"
test = true

[features]
default     = ["rustls-tls"]
blocking    = ["reqwest/blocking", "tokio/rt-multi-thread"]
rustls-tls  = ["reqwest/rustls-tls"]
native-tls  = ["reqwest/native-tls"]
integration = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets      = ["x86_64-unknown-linux-gnu"]
