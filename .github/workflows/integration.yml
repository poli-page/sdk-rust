name: integration

# Hits the live API. Kept out of the per-PR `CI` workflow so
# (a) forks/contributors don't need a secret to land changes, and
# (b) upstream outages don't red-X every PR.
#
# Triggers:
#   - schedule:        nightly at 06:00 UTC.
#   - push to main:    catch regressions on the integration branch promptly.
#   - workflow_dispatch: manual re-run from the Actions tab when needed.
#
# Secrets:
#   - POLI_PAGE_API_KEY: a `pp_sandbox_` key of an organization whose
#     `getting-started` project is untouched (the suite renders
#     getting-started/welcome with no version). Unset: the job logs a skip
#     and succeeds.
#   - POLI_PAGE_TEST_BASE_URL (optional): API base URL. Unset: the SDK
#     default applies.
# The `if:` on the job skips it on forks (where the secrets aren't
# available), so fork PRs that trigger this via push-to-main on a
# downstream branch fail-soft rather than fail-hard.

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  integration:
    name: integration / live API
    runs-on: ubuntu-latest
    # Skip on forks where the API-key secret isn't available.
    if: github.repository == 'poli-page/sdk-rust'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Only the `integration` target runs here, but any test command gets
      # the pinned API contract so tests/contract.rs never skips.
      - name: API contract
        id: contract
        uses: poli-page/api-contract@0eba96c1ecf9a28b7e259f444f3ca5b7c059d5fd # v1.3.0
      - name: cargo test (integration, --ignored)
        env:
          CI: "true"
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
          POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_API_KEY }}
          POLI_PAGE_TEST_BASE_URL: ${{ secrets.POLI_PAGE_TEST_BASE_URL }}
        shell: bash
        run: |
          if [ -z "$POLI_PAGE_API_KEY" ]; then
            echo "POLI_PAGE_API_KEY secret not set — skipping integration tests"
            exit 0
          fi
          # An unset secret arrives as "", which the tests would take as the
          # base URL; drop it so the SDK default applies.
          if [ -z "$POLI_PAGE_TEST_BASE_URL" ]; then
            unset POLI_PAGE_TEST_BASE_URL
          fi
          cargo test \
            --features integration \
            --test integration \
            --locked \
            -- --ignored
