name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan against main so we still get findings on a quiet repo.
    # Off-the-hour Monday slot — staggered from sdk-node (07:23) and
    # sdk-ruby (06:17) to dodge GH Actions scheduler peaks.
    - cron: "43 7 * * 1"

permissions:
  contents: read
  security-events: write

# All third-party Actions pinned to 40-char commit SHAs per spec §16.6
# (supply-chain hardening); Dependabot bumps SHA + tag together.

jobs:
  analyze:
    name: Analyze (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: rust
          # build-mode: none avoids invoking cargo — CodeQL parses sources
          # directly. Works for Rust per GitHub's default-setup guidance and
          # keeps the job fast on a single-crate workspace.
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: "/language:rust"
